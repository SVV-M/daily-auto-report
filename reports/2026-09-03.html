          { label: '播放量', value: '500万+' }, { label: 'UGC参与', value: '12万+' },
          { label: '试驾预约', value: '+60%' }
        ]
      },
      {
        id: '2026-09-03-user-growth', category: 'user-growth',
        title: '问界 M9 用户裂变体系拆解', brand: '问界（华为×赛力斯）', type: '产品驱动型裂变增长',
        sections: [
          { label: '情境 (Situation)', content: '问界M9定位高端，传统广告获客成本高（CAC>8000元），需激活存量用户的社交资产实现低成本增长。' },
          { label: '任务 (Task)', content: '设计产品体验驱动的裂变机制，将老带新转化率从5%提升至15%+，同时降低CAC至3000元以下。' },
          { label: '行动 (Action)', content: '① 鸿蒙互联体验——朋友试驾自动触发鸿蒙生态联动演示；② 场景化邀请——"带朋友体验AR-HUD"专属邀请码；③ 双端激励——推荐人获2000积分+被推荐人获首年免费保养；④ 社交货币设计——专属车主数字徽章可分享至社交平台。' },
          { label: '结果 (Result)', content: '老带新转化率从5%提升至18%，CAC从8200元降至2800元，裂变贡献销量占比达42%，推荐人平均推荐2.3人。' }
        ],
        metrics: [
          { label: '转化率', value: '5%→18%' }, { label: 'CAC', value: '8200→2800元' },
          { label: '裂变占比', value: '42%' }
        ]
      },
      {
        id: '2026-09-03-brand-building', category: 'brand-building',
        title: '领克品牌焕新视觉系统升级', brand: '领克', type: '品牌视觉焕新与系统化建设',
        sections: [
          { label: '情境 (Situation)', content: '领克从"年轻潮流"向"全球化高端"转型，旧视觉系统无法承载新定位，需建立统一且有辨识度的品牌语言。' },
          { label: '任务 (Task)', content: '完成品牌视觉系统全面升级，覆盖Logo、色彩、字体、影像风格、空间设计5大模块，确保全球市场一致性。' },
          { label: '行动 (Action)', content: '① Logo进化——保留都市对立美学DNA，线条更精炼国际化；② 色彩体系——从6色精简为3主色+2辅助色，提升高端感；③ 影像风格——建立"光影叙事"拍摄标准，全球统一视觉调性；④ 空间设计——新一代展厅"都市客厅"概念，全球50城同步更新；⑤ 数字触点——官网/App/社交视觉100%对齐新系统。' },
          { label: '结果 (Result)', content: '品牌认知度+35%，"高端感"认知从第8升至第4，全球视觉一致性评分从62分提升至91分，海外市场好感度+28%。' }
        ],
        metrics: [
          { label: '认知度', value: '+35%' }, { label: '高端排名', value: '8→4' },
          { label: '一致性', value: '62→91分' }
        ]
      }
    ];

    // --- 状态 ---
    const state = {
      activeDim: '__all__',
      bookmarkFilter: false,
      bookmarks: new Set(JSON.parse(localStorage.getItem('report-case-bookmarks') || '[]'))
    };

    const $ = (sel) => document.querySelector(sel);

    function showToast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    function toggleBookmark(caseId) {
      if (state.bookmarks.has(caseId)) {
        state.bookmarks.delete(caseId);
        showToast('已取消收藏');
      } else {
        state.bookmarks.add(caseId);
        showToast('⭐ 已收藏该案例');
      }
      localStorage.setItem('report-case-bookmarks', JSON.stringify([...state.bookmarks]));
      renderCases();
    }

    // --- 渲染维度Tab ---
    function renderDimTabs() {
      const bar = $('#dim-tabs');
      const dimIds = [...new Set(CASES.map(c => c.category))];

      let html = `<button class="dim-tab ${state.activeDim === '__all__' ? 'active' : ''}" data-dim="__all__">全部 (${CASES.length})</button>`;
      dimIds.forEach(dimId => {
        const cat = CATEGORIES.find(c => c.id === dimId);
        if (!cat) return;
        const count = CASES.filter(c => c.category === dimId).length;
        html += `<button class="dim-tab ${state.activeDim === dimId ? 'active' : ''}" data-dim="${dimId}">${cat.icon} ${cat.name} (${count})</button>`;
      });
      bar.innerHTML = html;

      bar.querySelectorAll('.dim-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeDim = btn.dataset.dim;
          renderDimTabs();
          renderCases();
        });
      });
    }

    // --- 渲染案例 ---
    function renderCases() {
      const container = $('#cases-container');
      let cases = CASES;

      // 维度筛选
      if (state.activeDim !== '__all__') {
        cases = cases.filter(c => c.category === state.activeDim);
      }

      // 收藏筛选
      if (state.bookmarkFilter) {
        cases = cases.filter(c => state.bookmarks.has(c.id));
      }

      // 空状态
      const empty = $('#empty-state');
      if (cases.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        container.innerHTML = cases.map((c, i) => {
          const cat = CATEGORIES.find(ct => ct.id === c.category);
          if (!cat) return '';
          const isBm = state.bookmarks.has(c.id);

          const sectionsHtml = c.sections.map(s => `
            <div class="case-section"><h4>${s.label}</h4><p>${s.content}</p></div>
          `).join('');

          const metricsHtml = c.metrics.map(m => `
            <span class="metric">${m.label} <strong>${m.value}</strong></span>
          `).join('');

          return `
            <div class="case" style="animation-delay:${i * 60}ms" data-case-id="${c.id}">
              <div class="case-header">
                <span class="case-cat" style="background:${cat.color}18;color:${cat.color}">${cat.icon} ${cat.name}</span>
                <span class="case-title">${c.title}</span>
                <button class="case-bm-btn ${isBm ? 'bookmarked' : ''}" data-case-id="${c.id}" title="${isBm ? '取消收藏' : '收藏该案例'}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="${isBm ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </button>
              </div>
              <p class="case-brand">品牌：${c.brand} | 类型：${c.type}</p>
              ${sectionsHtml}
              ${metricsHtml ? `<div class="case-metrics">${metricsHtml}</div>` : ''}
            </div>
          `;
        }).join('');

        // 绑定收藏按钮
        container.querySelectorAll('.case-bm-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleBookmark(btn.dataset.caseId);
          });
        });
      }

      // 更新筛选信息
      const bmCount = cases.filter(c => state.bookmarks.has(c.id)).length;
      let info = `共 ${cases.length} 个案例`;
      if (state.activeDim !== '__all__') {
        const cat = CATEGORIES.find(c => c.id === state.activeDim);
        if (cat) info = `${cat.icon} ${cat.name} · ${cases.length} 个案例`;
      }
      if (state.bookmarkFilter) info += ` · 已收藏 ${bmCount} 个`;
      $('#filter-info').textContent = info;
    }

    // --- 初始化 ---
    function init() {
      // 主题
      const savedTheme = localStorage.getItem('report-theme');
      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }

      $('#theme-btn').addEventListener('click', () => {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('report-theme', next);
      });

      // 收藏筛选
      $('#bm-filter-btn').addEventListener('click', () => {
        state.bookmarkFilter = !state.bookmarkFilter;
        $('#bm-filter-btn').classList.toggle('active', state.bookmarkFilter);
        renderCases();
      });

      renderDimTabs();
      renderCases();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
